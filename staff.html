const mx=(slides||[]).reduce((m,x)=>Math.max(m,x.sort||0),0);await rest("/rest/v1/home_slides","POST",{url:SBU+"/storage/v1/object/public/slides/"+path,path,sort:mx+1});toast("تمت إضافة الصورة ✅")}catch(_){msg="تعذر رفع الصورة، حاول مرة ثانية"}upl=false;await loadPromo();V()}
document.addEventListener("change",e=>{if(e.target&&e.target.id=="sfile"&&e.target.files&&e.target.files[0])addSlide(e.target.files[0])});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&!e.shiftKey&&e.target&&e.target.closest&&e.target.closest(".chf textarea")&&!("ontouchstart" in window)){e.preventDefault();const f=e.target.closest("form");if(f&&f.requestSubmit)f.requestSubmit()}});
const sst=()=>{try{sessionStorage.setItem("nw_stab",JSON.stringify({tab,flt}))}catch(_){}};
async function goTab(t){tab=t;msg="";sst();if(t=="stats"){stats=null;V();await loadStats()}if(t=="log")await loadLog();if(t=="staff")await loadStaff();if(t=="wallet")await loadWtx();if(t=="chat"){cvU=null;cvM=[];cvSig="";await loadChats()}if(t=="promo"){codes=null;slides=null;V();await loadPromo()}if(t=="orders"){newN=0;document.title=T0}V()}
function pr(id){const c=document.querySelector(`[data-id="${id}"]`);if(!c)return;c.setAttribute("data-print","1");window.print();setTimeout(()=>c.removeAttribute("data-print"),600)}
async function start(){await loadMe();if(isCourier())await loadMine();let st0=null;try{st0=JSON.parse(sessionStorage.getItem("nw_stab")||"null")}catch(_){}
if(st0&&["active","new","preparing","handed","out","delivered","cancelled","all"].includes(st0.flt))flt=st0.flt;
if(isStaff()){await loadCour();await loadOrders();await loadChats()}if(isAdmin())await loadWtx();
if(st0&&((isAdmin()&&["stats","log","staff","wallet","promo","chat"].includes(st0.tab))||(isStaff()&&st0.tab=="chat"))){await goTab(st0.tab);return}V()}
document.addEventListener("click",async e=>{const q=s=>e.target.closest(s);let b;
if(b=q("[data-pk]")){try{await pkLogin()}catch(x){msg=(x&&x.name=="NotAllowedError")?"تم إلغاء العملية":"تعذر الدخول بالبصمة، استخدم كلمة المرور";V()}return}
if(b=q("[data-eye]")){const i=b.parentElement.querySelector("input"),on=i.type==="password";i.type=on?"text":"password";b.innerHTML=on?EYE1:EYE0;return}
if(b=q("[data-st]"))return setSt(b.dataset.id,b.dataset.st);
if(b=q("[data-hand]"))return setHand(b.dataset.hand);
if(b=q("[data-cr]"))return crSet(b.dataset.id,b.dataset.cr);
if(b=q("[data-pr]"))return pr(b.dataset.pr);
if(b=q("[data-tab]"))return goTab(b.dataset.tab);
if(b=q("[data-cv]")){cvU=b.dataset.cv;cvM=[];cvSig="";chErr="";V();await loadConv();cvPaint();return}
if(b=q("[data-cvx]")){cvU=null;cvM=[];cvSig="";chErr="";await loadChats();return V()}
if(b=q("[data-ktog]")){const c=(codes||[]).find(x=>x.code===b.dataset.ktog);if(!c)return;try{await rest("/rest/v1/discount_codes?code=eq."+encodeURIComponent(c.code),"PATCH",{active:!c.active});msg="";toast(c.active?"تم إيقاف الكود":"تم تشغيل الكود")}catch(_){msg="تعذر الحفظ"}await loadPromo();return V()}
if(b=q("[data-kdel]")){if(!confirm("مسح الكود "+b.dataset.kdel+" نهائياً؟"))return;try{await rest("/rest/v1/discount_codes?code=eq."+encodeURIComponent(b.dataset.kdel),"DELETE");msg="";toast("تم مسح الكود")}catch(_){msg="تعذر المسح"}await loadPromo();return V()}
if(b=q("[data-sdel]")){if(!confirm("مسح هذي الصورة من الصفحة الرئيسية؟"))return;const x=(slides||[]).find(y=>String(y.id)===b.dataset.sdel);try{await rest("/rest/v1/home_slides?id=eq."+x.id,"DELETE");if(x.path){const t=await tok();fetch(SBU+"/storage/v1/object/slides/"+x.path,{method:"DELETE",headers:{apikey:SBK,Authorization:"Bearer "+t}}).catch(()=>{})}msg="";toast("تم مسح الصورة")}catch(_){msg="تعذر المسح"}await loadPromo();return V()}
if(b=q("[data-smv]")){const L=slides||[],i=L.findIndex(y=>String(y.id)===b.dataset.sid),j=i+(+b.dataset.smv);if(i<0||j<0||j>=L.length)return;const A=L[i],B=L[j];try{const L2=L.slice();L2[i]=B;L2[j]=A;await Promise.all(L2.map((y,k)=>y.sort===k+1?null:rest("/rest/v1/home_slides?id=eq."+y.id,"PATCH",{sort:k+1})));msg=""}catch(_){msg="تعذر تغيير الترتيب"}await loadPromo();return V()}
if(b=q("[data-fl]")){flt=b.dataset.fl;sst();return V()}
if(b=q("[data-cm]")){cmode=b.dataset.cm=="gst"?"gst":"reg";return V()}
if(b=q("[data-rf]")){if(b.dataset.rf=="wallet")await loadWtx();else if(b.dataset.rf=="promo")await loadPromo();else if(b.dataset.rf=="stats")await loadStats();else await loadLog();return V()}
if(b=q("[data-wd]")){const ap=b.dataset.wd==="1",x=wtx.find(y=>String(y.id)===b.dataset.tx);if(!confirm(ap?"تأكدت من وصول الحوالة بمبلغ "+(x?money(x.amount):"")+"؟ سيُضاف الرصيد لحساب العميل.":"رفض طلب الشحن؟"))return;try{const nb=await rpc("admin_decide_topup",{p_tx:+b.dataset.tx,p_approve:ap});msg="";toast(ap?"تمت الموافقة. رصيد العميل الآن "+money(nb):"تم رفض الطلب")}catch(e){msg=e.message}await loadWtx();return V()}
if(b=q("[data-rm]")){if(confirm("إزالة صلاحية هذا الحساب؟")){try{await setRole(b.dataset.rm,"customer");await loadCour();msg=""}catch(x){msg=x.message}V()}}});
document.addEventListener("submit",async e=>{const f=e.target.closest("[data-f]");if(!f)return;e.preventDefault();const fd=new FormData(f),k=f.dataset.f;
if(k=="login"){msg="";try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login:fd.get("l"),password:fd.get("pw")})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.access_token)throw new Error("بيانات الدخول غير صحيحة");setS(d);await start()}catch(x){msg=x.message||"حصل خطأ";V()}}
else if(k=="credit"){try{const n=Number(fd.get("am"));if(!Number.isFinite(n)||n===0)throw new Error("المبلغ غير صحيح");const nb=await rpc("admin_add_credit",{p_login:normLg(fd.get("lg")),p_amount:n,p_kind:String(fd.get("kd")||"gift"),p_note:String(fd.get("nt")||"")||null});msg="";toast("تم. رصيد العميل الآن "+money(nb));await loadWtx()}catch(e){msg=e.message}V()}
else if(k=="code"){try{const cd=String(fd.get("cd")||"").trim().toUpperCase().replace(/\s+/g,""),kd=fd.get("kd")=="fix"?"fix":"pct",vl=Number(fd.get("vl")),ex=String(fd.get("ex")||"")||null;
if(cd.length<2||cd.length>20)throw new Error("اسم الكود لازم يكون من 2 إلى 20 حرف، بدون مسافات");if(!(vl>0))throw new Error("اكتب قيمة الخصم");if(kd=="pct"&&vl>90)throw new Error("النسبة لازم تكون 90% أو أقل");if(ex&&ex<today())throw new Error("تاريخ الانتهاء فات");
try{await rest("/rest/v1/discount_codes","POST",{code:cd,kind:kd,value:vl,expires_on:ex,active:true})}catch(x){throw new Error(x.code=="23505"?"الكود "+cd+" موجود من قبل، اختار اسم ثاني أو امسح القديم":"تعذر حفظ الكود")}
msg="";toast("تم حفظ الكود "+cd+" ✅");await loadPromo()}catch(x){msg=x.message}V()}
else if(k=="reply"){const ta=f.querySelector("textarea"),bt=f.querySelector("button"),m=String(fd.get("m")||"").trim();if(!m||!cvU)return;bt.disabled=true;try{await rpc("staff_chat_reply",{p_user:cvU,p_body:m.slice(0,1000)});ta.value="";chErr="";await loadConv();cvPaint();loadChats()}catch(_){chErr="تعذر إرسال الرد، حاول مرة ثانية";V()}bt.disabled=false}
else if(k=="role"){try{await setRole(String(fd.get("em")||""),String(fd.get("rl")||"staff"));await loadCour();msg="";toast("تم الحفظ")}catch(x){msg=x.message}V()}});
$("#snsel").innerHTML=Object.keys(SNDS).map(k=>`<option value="${k}">${SNDS[k].n}</option>`).join("");$("#snsel").value=snd;
$("#snsel").onchange=()=>{const v=$("#snsel").value;if(!SNDS[v])return;snd=v;try{localStorage.setItem("nw_snd",v)}catch(_){}try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume();$("#snd").textContent="🔔 الصوت مفعل"}catch(_){}beep()};
$("#snd").onclick=()=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume();beep();$("#snd").textContent="🔔 الصوت مفعل";if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(()=>{})}catch(_){toast("تعذر تفعيل الصوت")}};
$("#out").onclick=()=>{const t=ses&&ses.access_token;ses=null;me=null;orders=[];known=null;svs();if(t)au("/auth/v1/logout",{method:"POST"},t).catch(()=>{});V()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden){newN=0;document.title=T0;if(ses&&(isStaff()||isCourier()))poll()}});
setInterval(poll,10000);
setInterval(()=>{if(ses&&isStaff()&&tab=="chat"&&cvU&&!document.hidden)loadConv().then(c=>{if(c)cvPaint()})},4000);
start();
</script>
</body>
