<style>

body{margin:0;font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--g);color:#fff;padding:12px 14px}

main{max-width:760px;margin:auto;padding:12px}
.tabs,.fl{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}

.fl button{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--c);background:var(--card);color:var(--c);border-radius:14px;padding:10px 4px;font-weight:700;font-size:12.5px;line-height:1.3}

.cr2{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.cr2:last-child{border-bottom:0}.cr2 .vf{color:#15803d;font-weight:800}
.slg{display:block;height:84px;margin:4px auto 14px}
body.lgn{background:#fff}body.lgn .box{background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}

.card h3{margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:16px}

.m{color:var(--mut);font-size:13px}
.card ul{margin:8px 0;padding:0;list-style:none;font-size:14px}

.btns button{border:1px solid var(--line);background:#f3f0e4;border-radius:10px;padding:8px 12px;font-size:13px}
.btns .pri{background:var(--g);color:#fff;border-color:var(--g)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}

label{font-size:13px;color:var(--mut)}

.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
a{color:#1b7a45}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#1d2b22;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}

@media print{body *{visibility:hidden}[data-print],[data-print] *{visibility:visible}[data-print]{position:absolute;top:0;left:0;width:100%;border:0}.btns{display:none}@page{margin:6mm}}
.pw{position:relative}.pw input{padding-inline-end:46px}.eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(calc(-50% - 2px));background:none;border:0;padding:8px;line-height:0;color:var(--mut)}.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fpw{display:flex;justify-content:center;margin:14px 0 4px}.fpb{width:64px;height:64px;border:0;background:none;color:#1b7a45;display:grid;place-items:center;padding:0;cursor:pointer}.fpb svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.hand{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}.hand select{width:auto;flex:1;min-width:140px;margin:0}
.stt{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stt div{background:#e4f5ea;border-radius:14px;padding:14px;text-align:center}.stt b{display:block;font-size:30px;color:#0a5c33}.stt span{font-size:13px;color:#2f5a42}
.big{font-size:16px;padding:14px}
.top select{width:auto;margin:0;background:#fff2;border:1px solid #fff5;color:#fff;border-radius:99px;padding:6px 10px;font-size:13px}.top select option{color:#000}

.cvr{display:flex;gap:10px;align-items:center;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;color:var(--tx);font:inherit}

.cvr .cx{flex:1;min-width:0}.cvr .cx b{display:block}.cvr .cx span{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cvr .un{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:#dc2626;color:#fff;font-weight:800;font-size:12px;padding:0 6px;margin-top:4px}

.chw{display:flex;flex-direction:column;height:calc(100dvh - 300px);min-height:340px}
.chl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px 2px}

.cvh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cvh button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 12px;font-size:18px}
.kr{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.kr:last-child{border-bottom:0}
.kr .kc{font-weight:800;font-size:16px;letter-spacing:.5px}
.kchip{display:inline-block;font-size:12px;border-radius:99px;padding:2px 8px;color:#fff}
.sgr{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sgr .si{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.sgr img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}

.upb{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed #2f8a57;color:#2f8a57;border-radius:14px;padding:14px;font-weight:700;cursor:pointer;margin-bottom:10px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.pc{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.pc:last-of-type{border-bottom:0}
.pc .th{flex:none;width:46px;height:46px;border-radius:10px;background:#f2b45733;display:grid;place-items:center;font-size:22px;overflow:hidden}.pc .th img{width:100%;height:100%;object-fit:cover}
.pc .pn{flex:1;min-width:0}.pc .pn b{display:block}.pc .pn span{font-size:13px;color:var(--mut)}
.pc .btns{margin:0;flex-wrap:nowrap}
.pc.off .th,.pc.off .pn{opacity:.5}
.chd{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.chd h3{margin:0;font-size:17px}
.ofp{color:#e0443e;font-weight:800}
.cr2[data-cfu],.cr2[data-cfp]{cursor:pointer}
.cft{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.cft div{background:#e4f5ea;border-radius:12px;padding:10px;text-align:center}.cft b{display:block;font-size:18px;color:#0a5c33}.cft span{font-size:12px;color:var(--mut)}
.cfo{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.cfo ul{margin:4px 0 0;padding-inline-start:18px;color:var(--mut);font-size:13px}
.pimg{width:100%;max-width:240px;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;margin:6px 0}
.ck{display:flex;align-items:center;gap:8px;margin-top:10px}.ck input{width:20px;height:20px}

#crp{position:fixed;inset:0;z-index:50;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;touch-action:none}
#crp .fr{position:relative;width:min(92vw,440px);overflow:hidden;border-radius:14px;background:#111;box-shadow:0 0 0 2px #fff}
#crp .fr img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none;touch-action:none}
#crp .fr.rd{border-radius:50%}
#crp p{color:#fff;margin:0;font-size:14px;text-align:center}
#crp input[type=range]{width:min(92vw,440px);accent-color:#2f8a57}
#crp .cb{display:flex;gap:10px;width:min(92vw,440px)}
#crp .cb button{flex:1;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:800}
#crp .cb .ok{background:#2f8a57;color:#fff}#crp .cb .no{background:#fff;color:#1d2b22}
.cav{flex:none;width:40px;height:40px;border-radius:50%;background:#e4f5ea;color:#1b7a45;display:inline-grid;place-items:center;font-weight:800;overflow:hidden;vertical-align:middle;margin-inline-end:8px}.cav img{width:100%;height:100%;object-fit:cover}
.cav.big{width:64px;height:64px;font-size:24px}
.cr2{align-items:center}
s{text-decoration-color:#e0443e;text-decoration-thickness:2px}
.tr2{color:var(--mut);font-size:12px;margin:2px 0 0}
.row[data-sf]{cursor:pointer}
.cimg{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:6px 0}

/* ===== new look ===== */
:root{--bg:#f3f5f2;--card:#fff;--tx:#17251c;--mut:#6b7a70;--line:#e6ebe6;--g:#0a5c33;--g2:#2f8a57;--soft:#eaf5ee;--in:#fff;--sh:0 1px 2px #0000000a,0 4px 14px #0000000d;color-scheme:light}

body{background:var(--bg);color:var(--tx)}

.ttl{display:flex;flex-direction:column;min-width:0}.ttl b{font-size:16px;white-space:nowrap}.ttl span{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{padding:14px 12px}
.box,.card,.cvr{border:0;box-shadow:var(--sh);border-radius:18px}
.card{position:relative;padding:14px 14px 12px;border-inline-start:5px solid var(--sc,#94a3b8)}

.fl{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;grid-template-columns:none}.fl::-webkit-scrollbar{display:none}
.fl button{flex:none;flex-direction:row;gap:6px;border:0;background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:13px;box-shadow:var(--sh)}

/* ===== update 13 ===== */
.fl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow:visible;padding:2px 0 12px}
.fl button{flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px 9px;border-radius:16px;font-size:11.5px;line-height:1.2;text-align:center;white-space:normal;min-width:0}
.fl button b{font-size:15px;min-width:30px;height:26px}
.fl button span{display:block;min-height:2.4em;display:flex;align-items:center}
@media (max-width:340px){.fl button{font-size:10.5px}}
.psh{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#0a5c33,#2f8a57);color:#fff;border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:var(--sh)}
.psh svg{flex:none;width:34px;height:34px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.psh div{flex:1;font-size:13px;line-height:1.5}.psh b{font-size:14.5px;display:block}
.psh button{flex:none;background:#fff;color:#0a5c33;border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-family:inherit}
.psh.w{background:var(--card);color:var(--tx);border:1.5px dashed #f2b457}.psh.w svg{stroke:#c98a16}
.cdh{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 10px}
.cdh div{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.cdh small{display:block;color:var(--mut);font-size:12px;font-weight:700}
.cdh b{display:block;font-size:22px;color:#1b7a45;margin:2px 0}
.cdh span{font-size:12.5px;color:var(--mut)}
.cdh .big{grid-column:1/-1;background:linear-gradient(135deg,#0a5c33,#2f8a57);color:#fff}
.cdh .big small,.cdh .big span{color:#d7f2e1}.cdh .big b{color:#fff;font-size:28px}
[data-theme="dark"] .cdh b{color:#7fe0a8}
.dues{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid #f2b457;border-radius:16px;padding:12px;margin:10px 0;background:var(--card)}
.dues>span{flex:1;min-width:0}.dues .sub{width:auto!important;flex:none;margin:0!important;padding:11px 14px!important;white-space:nowrap}
.dues b{font-size:22px;color:#b7791f}.dues small{display:block;color:var(--mut)}
.bnk .row b{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
.cpb{border:0;background:var(--soft);color:var(--g2);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;margin-inline-start:6px;font-family:inherit}
details.cdl summary{cursor:pointer;font-weight:800;padding:4px 0}
.dwsrc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.dwsrc button{border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:12px 6px;font-weight:800;font-family:inherit}
.dwsrc button.on{border-color:#2f8a57;background:#2f8a57;color:#fff}
.dwp{display:flex;gap:10px;align-items:center;width:100%;text-align:start;border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:14px;padding:8px;margin:0 0 8px;font-family:inherit}
.dwp.on{border-color:#2f8a57;box-shadow:0 0 0 3px #2f8a5733}
.dwp img,.dwp .ph{flex:none;width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--soft)}
.dwp span{flex:1;min-width:0;font-size:12.5px;line-height:1.4}.dwp i{font-style:normal;font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:1px 6px;margin-inline-end:4px}
.dwp i.fb{background:#0866ff}.dwp i.ig{background:#d62976}
.dwr{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.dwr label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;margin:0;flex:1;min-width:140px}
.dwr input[type=radio],.dwr input[type=checkbox]{width:18px;height:18px;margin:0}
.dwc{text-align:center;font-weight:800;color:#1b7a45;background:var(--soft);border-radius:12px;padding:10px;margin:10px 0}
.dwgo{width:100%;font-size:17px;padding:15px!important}
.dww{border:2px solid #f2b457;border-radius:16px;padding:12px;margin:8px 0;background:var(--card)}
.dww .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dww b{font-size:17px}.dww p{margin:6px 0;font-size:13px;color:var(--mut);white-space:pre-wrap;word-break:break-word}
#dwo{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,#2f8a57,#0a5c33 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#dwo small{font-size:15px;opacity:.85;font-weight:700}
#dwo .nm{font-size:clamp(26px,8vw,44px);font-weight:900;min-height:1.3em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dwo .nm.win{animation:dwpop .5s cubic-bezier(.2,1.6,.4,1)}
#dwo .ct{max-width:520px;font-size:15px;opacity:.9;white-space:pre-wrap}
#dwo .tr{font-size:64px;line-height:1}
#dwo button{background:#fff;color:#0a5c33;border:0;border-radius:14px;padding:12px 26px;font-weight:900;font-size:16px;font-family:inherit}
@keyframes dwpop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#dwo .nm.win{animation:none}}
