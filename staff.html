<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الطلبات - عالم المكسرات</title>
<style>
:root{--bg:#f6f3ea;--card:#fff;--tx:#1d2b22;--mut:#6b7a70;--line:#e3dcc8;--g:#0a5c33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--g);color:#fff;padding:12px 14px}
.top b{flex:1;font-size:17px}.top span{font-size:13px;opacity:.9}
button{font:inherit;cursor:pointer}
.top button{background:#fff2;border:1px solid #fff5;color:#fff;border-radius:99px;padding:6px 12px;font-size:13px}
main{max-width:760px;margin:auto;padding:12px}
.tabs,.fl{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.tabs button,.fl button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;color:var(--tx)}
.tabs .on,.fl .on{background:var(--g);color:#fff;border-color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.card.nw{border:2px solid #d97706}
.card h3{margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:16px}
.chip{font-size:12px;color:#fff;border-radius:99px;padding:3px 10px}
.m{color:var(--mut);font-size:13px}
.card ul{margin:8px 0;padding:0;list-style:none;font-size:14px}
.card li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns button{border:1px solid var(--line);background:#f3f0e4;border-radius:10px;padding:8px 12px;font-size:13px}
.btns .pri{background:var(--g);color:#fff;border-color:var(--g)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
input,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--tx);margin:4px 0 8px}
label{font-size:13px;color:var(--mut)}
.sub{width:100%;background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:700}
.er{background:#fdecea;color:#b3261e;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
a{color:#1b7a45}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#1d2b22;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#ts.on{opacity:1}
@media print{body *{visibility:hidden}[data-print],[data-print] *{visibility:visible}[data-print]{position:absolute;top:0;left:0;width:100%;border:0}.btns{display:none}@page{margin:6mm}}
.pw{position:relative}.pw input{padding-inline-end:46px}.eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(calc(-50% - 2px));background:none;border:0;padding:8px;line-height:0;color:var(--mut)}.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top select{width:auto;margin:0;background:#fff2;border:1px solid #fff5;color:#fff;border-radius:99px;padding:6px 10px;font-size:13px}.top select option{color:#000}
</style>
</head>
<body>
<header class="top"><b>🥜 لوحة الطلبات</b><span id="who"></span><select id="snsel" aria-label="نغمة التنبيه"></select><button id="snd" type="button">🔔 تفعيل الصوت</button><button id="out" type="button" hidden>خروج</button></header>
<main id="app"></main>
<div id="ts"></div>
<script>
const SBU="https://fffremcwrsgovpgfyrwd.supabase.co",SBK="sb_publishable_-JgCE3ZQ_hrQ53GcI7Q6Jw_ilrBUXXb";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ST={new:["جديد","#d97706"],preparing:["قيد التجهيز","#2563eb"],delivered:["تم التوصيل","#15803d"],cancelled:["ملغي","#b91c1c"]};
const PAY={cod:"عند الاستلام",bank:"تحويل مصرفي (تأكد من الإيصال)",wallet:"✅ مدفوع من المحفظة",card:"بطاقة"};
const T0="لوحة الطلبات - عالم المكسرات";
const EYE0='<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',EYE1='<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c6 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.4 6.9C3.7 8.6 2 12 2 12s4 6 10 6c1.4 0 2.7-.3 3.9-.8"/><path d="M9.9 10a3 3 0 0 0 4.1 4.1"/></svg>';
let ses=null,me=null,tab="orders",flt="active",orders=[],known=null,newN=0,actx=null,msg="",logs=[],staff=[],wtx=[],wpend=null,sig="",tm;
try{ses=JSON.parse(localStorage.getItem("nw_ses")||"null")}catch(_){}
const svs=()=>{try{if(ses)localStorage.setItem("nw_ses",JSON.stringify(ses));else localStorage.removeItem("nw_ses")}catch(_){}};
const au=(p,o,t)=>{o=o||{};return fetch(SBU+p,{...o,headers:{apikey:SBK,"Content-Type":"application/json",...(t?{Authorization:"Bearer "+t}:{}),...(o.headers||{})}})};
const setS=d=>{ses={access_token:d.access_token,refresh_token:d.refresh_token,exp:Math.floor(Date.now()/1000)+(d.expires_in||3600),uid:(d.user&&d.user.id)||(ses&&ses.uid)};svs()};
async function tok(){if(!ses)return null;if(ses.exp-60>Date.now()/1000)return ses.access_token;
try{const r=await au("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:ses.refresh_token})});const d=await r.json();if(r.ok&&d.access_token){setS(d);return ses.access_token}}catch(_){}
ses=null;me=null;svs();return null}
const isStaff=()=>!!me&&(me.role==="staff"||me.role==="admin"),isAdmin=()=>!!me&&me.role==="admin";
function toast(m){const t=$("#ts");t.textContent=m;t.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>t.classList.remove("on"),2200)}
const ring=[];for(let k=0;k<2;k++)for(let j=0;j<10;j++)ring.push([j%2?480:440,k*1.5+j*.08,.08]);
const SNDS={
beep:{n:"بيب (الافتراضي)",w:"sine",g:.25,d:0,t:[[880,0,.18],[880,.25,.18],[880,.5,.18]]},
bell:{n:"جرس",w:"sine",g:.4,d:1,t:[[988,0,.9],[784,.4,1.1],[988,1.5,.9],[784,1.9,1.1]]},
ring:{n:"رنين هاتف",w:"square",g:.12,d:0,t:ring},
alarm:{n:"تنبيه قوي",w:"sawtooth",g:.25,d:0,t:[[660,0,.2],[880,.25,.2],[660,.5,.2],[880,.75,.2],[660,1,.2],[880,1.25,.2]]},
soft:{n:"هادئ",w:"triangle",g:.3,d:1,t:[[523,0,.5],[659,.25,.5],[784,.5,.9]]}};
let snd="beep";try{const v=localStorage.getItem("nw_snd");if(v&&SNDS[v])snd=v}catch(_){}
function beep(){if(!actx)return;const s=SNDS[snd]||SNDS.beep;
try{s.t.forEach(([f,d,l])=>{const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+d;o.type=s.w;o.frequency.value=f;g.gain.setValueAtTime(s.g,t0);if(s.d)g.gain.exponentialRampToValueAtTime(.001,t0+l);else g.gain.setValueAtTime(s.g,t0+l-.02);o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+l)})}catch(_){}}
const tm2=s=>new Date(s).toLocaleString("en-GB",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const money=v=>v==null?"—":String(+(+v).toFixed(2))+" د.ل";
const link=s=>esc(s).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u.length>34?"فتح الرابط":u}</a>`);

async function loadMe(){const t=await tok();if(!t){me=null;return}
try{const r=await au("/rest/v1/profiles?select=id,full_name,email,role&id=eq."+ses.uid,{},t);const a=await r.json();me=(Array.isArray(a)&&a[0])||null}catch(_){me=null}}
const fl=o=>flt=="all"||(flt=="active"?(o.status=="new"||o.status=="preparing"):o.status==flt);
function card(o){const its=(Array.isArray(o.items)?o.items:[]).map(i=>`<li><span>${esc(i.name)} · ${esc(i.qty)}</span><b>${esc(i.sum)} د.ل</b></li>`).join(""),s=ST[o.status]||[o.status,"#666"];
const btn=Object.keys(ST).filter(k=>k!==o.status).map(k=>`<button type="button" data-st="${k}" data-id="${o.id}" class="${k=="preparing"||k=="delivered"?"pri":""}">${ST[k][0]}</button>`).join("");
const loc=o.location&&o.location.lat?`<a href="https://maps.google.com/?q=${esc(o.location.lat)},${esc(o.location.lon)}" target="_blank" rel="noopener">📍 موقع العميل على الخريطة</a><br>`:"";
return `<article class="card ${o.status=="new"?"nw":""}" data-id="${o.id}"><h3><span>#${o.id} · ${esc(o.customer_name)}</span><span class="chip" style="background:${s[1]}">${s[0]}</span></h3>
<div class="m">${tm2(o.created_at)} · ${esc(PAY[o.payment]||o.payment)}${o.user_id?" · عميل مسجل":""}</div>
<p style="margin:6px 0"><a href="tel:${esc(o.phone)}">📞 ${esc(o.phone)}</a><br>${esc(o.city)}<br>${loc}<span class="m">${link(o.address)}</span></p>
<ul>${its}</ul>
<div class="m">المجموع ${money(o.subtotal)}${+o.discount?" · خصم "+money(o.discount):""} · التوصيل ${o.delivery==null?"يُحدَّد":money(o.delivery)}</div>
<b>الإجمالي ${money(o.total)}</b>
<div class="btns">${btn}<button type="button" data-pr="${o.id}">🖨 طباعة</button></div></article>`}
function V(){const a=$("#app");$("#out").hidden=!ses;$("#who").textContent=me?(me.full_name||me.email||""):"";
if(!ses||!me){a.innerHTML=`<form class="box" data-f="login"><h3 style="margin-top:0">تسجيل الدخول</h3>${msg?`<div class="er">${esc(msg)}</div>`:""}<label>رقم الهاتف أو الإيميل</label><input name="l" autocomplete="username" required><label>كلمة المرور</label><div class="pw"><input name="pw" type="password" autocomplete="current-password" required><button type="button" class="eye" data-eye aria-label="إظهار كلمة المرور">${EYE0}</button></div><button class="sub" type="submit">دخول</button></form>`;return}
if(!isStaff()){a.innerHTML=`<div class="box">لا تملك صلاحية دخول هذه الصفحة. تواصل مع المدير.</div>`;return}
const tabs=[["orders","الطلبات"]].concat(isAdmin()?[["log","سجل النشاط"],["staff","الموظفون"],["wallet","المحفظة"]]:[]);
let h=`<div class="tabs">${tabs.map(t=>`<button type="button" data-tab="${t[0]}" class="${tab==t[0]?"on":""}">${t[1]}${t[0]=="orders"&&newN?` (${newN})`:""}${t[0]=="wallet"&&wpend?` (${wpend})`:""}</button>`).join("")}</div>`;
if(tab=="orders"){const fs=[["active","النشطة"],["new","جديد"],["preparing","قيد التجهيز"],["delivered","تم التوصيل"],["cancelled","ملغي"],["all","الكل"]];
const list=orders.filter(fl);
h+=`<div class="fl">${fs.map(f=>`<button type="button" data-fl="${f[0]}" class="${flt==f[0]?"on":""}">${f[1]}</button>`).join("")}</div>`+(list.length?list.map(card).join(""):`<div class="box m">لا توجد طلبات هنا</div>`)}
else if(tab=="log"){h+=`<div class="box"><div class="btns" style="margin:0 0 6px"><button type="button" data-rf="log">تحديث</button></div>`+(logs.length?logs.map(e=>`<div class="row"><span>${tm2(e.created_at)} · ${e.order_id?"#"+e.order_id+" · ":""}<b>${esc(e.actor_name||"النظام")}</b></span><span>${e.event=="created"?"وصل طلب جديد":e.event=="status"?`${(ST[e.from_status]||[e.from_status])[0]} ← ${(ST[e.to_status]||[e.to_status])[0]}`:esc(e.note||"")}</span></div>`).join(""):`<p class="m">لا توجد أحداث بعد</p>`)+`</div>`}
else if(tab=="wallet"){const pend=wtx.filter(x=>x.kind=="topup"&&x.status=="pending"),KD={topup:"شحن",gift:"هدية",refund:"استرجاع",purchase:"شراء",adjust:"تعديل"},SD={pending:"بانتظار الموافقة",approved:"",rejected:"مرفوض"},nm=x=>(x.profiles&&(x.profiles.full_name||x.profiles.email))||"—";
h+=`${msg?`<div class="er">${esc(msg)}</div>`:""}<div class="box"><h3 style="margin-top:0">طلبات الشحن المعلقة (${pend.length})</h3>`+(pend.length?pend.map(x=>`<div class="row"><span><b>${esc(nm(x))}</b> <span class="m" dir="ltr">${esc((x.profiles&&x.profiles.phone)||"")}</span><br><span class="m">${tm2(x.created_at)} · طلب #${x.id}${x.note?" · "+esc(x.note):""}</span></span><span style="text-align:end"><b>${money(x.amount)}</b><br><span class="btns" style="margin:4px 0 0"><button type="button" class="pri" data-wd="1" data-tx="${x.id}">قبول</button><button type="button" data-wd="0" data-tx="${x.id}">رفض</button></span></span></div>`).join(""):`<p class="m">لا توجد طلبات معلقة</p>`)+`</div>
<form class="box" data-f="credit"><h3 style="margin-top:0">إضافة رصيد لحساب</h3><p class="m">هدية أو استرجاع. ولخصم رصيد اكتب مبلغاً بالسالب مع نوع "تعديل".</p><label>إيميل العميل أو رقم هاتفه</label><input name="lg" required><label>المبلغ (دينار)</label><input name="am" type="number" step="0.01" required><label>النوع</label><select name="kd"><option value="gift">هدية</option><option value="refund">استرجاع</option><option value="adjust">تعديل</option></select><label>ملاحظة (اختياري)</label><input name="nt"><button class="sub" type="submit">تنفيذ</button></form>
<div class="box"><div class="btns" style="margin:0 0 6px"><button type="button" data-rf="wallet">تحديث</button></div><h3 style="margin-top:0">آخر الحركات</h3>`+(wtx.length?wtx.map(x=>`<div class="row"><span>${tm2(x.created_at)} · <b>${esc(nm(x))}</b><br><span class="m">${KD[x.kind]||x.kind}${SD[x.status]?" · "+SD[x.status]:""}${x.note?" · "+esc(x.note):""}</span></span><b style="color:${+x.amount<0?"#b3261e":"#15803d"}">${+x.amount>0?"+":""}${money(x.amount)}</b></div>`).join(""):`<p class="m">لا توجد حركات بعد</p>`)+`</div>`}
else{h+=`${msg?`<div class="er">${esc(msg)}</div>`:""}<form class="box" data-f="role"><h3 style="margin-top:0">إضافة موظف</h3><p class="m">الموظف يسجل حساباً عادياً في الموقع أولاً، ثم اكتب إيميله هنا.</p><label>إيميل الحساب</label><input name="em" type="email" required><label>الصلاحية</label><select name="rl"><option value="staff">موظف</option><option value="admin">مدير</option></select><button class="sub" type="submit">حفظ</button></form><div class="box"><h3 style="margin-top:0">الفريق</h3>`+(staff.length?staff.map(s=>`<div class="row"><span>${esc(s.full_name||"")} <span class="m" dir="ltr">${esc(s.email||"")}</span></span><span>${s.role=="admin"?"مدير":"موظف"}${s.id!==ses.uid?` <button type="button" data-rm="${esc(s.email)}">إزالة</button>`:""}</span></div>`).join(""):`<p class="m">—</p>`)+`</div>`}
a.innerHTML=h}
async function loadOrders(){const t=await tok();if(!t)return false;
try{const r=await au("/rest/v1/orders?select=*&order=created_at.desc&limit=100",{},t);const a=await r.json();if(!Array.isArray(a))return false;
const ids=new Set(a.map(o=>o.id));
if(known){const fresh=a.filter(o=>!known.has(o.id));if(fresh.length){newN+=fresh.length;beep();toast("🔔 طلب جديد #"+fresh.map(o=>o.id).join(" #"));document.title="🔔 ("+newN+") طلب جديد"}}
known=ids;const s=JSON.stringify(a);const ch=s!==sig;sig=s;orders=a;return ch}catch(_){return false}}
async function poll(){if(!ses||!isStaff())return;const ch=await loadOrders();let wc=false;
if(isAdmin()){try{const t=await tok(),r=await au("/rest/v1/wallet_tx?select=id&kind=eq.topup&status=eq.pending",{},t),a=await r.json();if(Array.isArray(a)){if(wpend!==null&&a.length>wpend){beep();toast("💰 طلب شحن جديد");wc=true}else if(a.length!==wpend)wc=true;wpend=a.length;if(tab=="wallet"&&wc){await loadWtx()}}}catch(_){}}
if((ch&&tab=="orders")||(wc&&(tab=="wallet"||tab=="orders")))V()}
async function loadLog(){const t=await tok();try{const r=await au("/rest/v1/order_events?select=*&order=created_at.desc&limit=200",{},t);const a=await r.json();logs=Array.isArray(a)?a:[]}catch(_){logs=[]}}
async function loadStaff(){const t=await tok();try{const r=await au("/rest/v1/profiles?select=id,full_name,email,role&role=in.(staff,admin)&order=role.asc",{},t);const a=await r.json();staff=Array.isArray(a)?a:[]}catch(_){staff=[]}}
async function setSt(id,s){const o0=orders.find(x=>String(x.id)===String(id));if(s=="cancelled"&&!confirm("تأكيد إلغاء الطلب #"+id+"؟"+(o0&&o0.payment=="wallet"?"\nسيُرد المبلغ لمحفظة العميل تلقائياً.":"")))return;const t=await tok();
try{const r=await au("/rest/v1/orders?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify({status:s})},t);const a=await r.json();
if(r.ok&&Array.isArray(a)&&a.length){const o=orders.find(x=>String(x.id)===String(id));if(o)o.status=s;sig=JSON.stringify(orders);toast("تم تغيير الحالة")}else toast("تعذر تغيير الحالة")}catch(_){toast("تعذر تغيير الحالة")}V()}
async function loadWtx(){const t=await tok();try{const r=await au("/rest/v1/wallet_tx?select=id,created_at,user_id,amount,kind,status,note,order_id,profiles(full_name,phone,email)&order=created_at.desc&limit=100",{},t);const a=await r.json();wtx=Array.isArray(a)?a:[];wpend=wtx.filter(x=>x.kind=="topup"&&x.status=="pending").length}catch(_){wtx=[]}}
const WERR=m=>/not pending/.test(m)?"هذا الطلب تمت معالجته من قبل":/user not found/.test(m)?"لم نجد حساباً بهذا الإيميل أو الرقم":/insufficient/.test(m)?"رصيد العميل لا يكفي للخصم":/bad amount/.test(m)?"المبلغ غير صحيح":/not allowed/.test(m)?"ليس لديك صلاحية":"تعذر تنفيذ العملية";
async function rpc(fn,args){const t=await tok();const r=await au("/rest/v1/rpc/"+fn,{method:"POST",body:JSON.stringify(args)},t);const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(WERR(String((d&&d.message)||"")));return d}
const normLg=v=>{v=String(v||"").trim();if(v.includes("@"))return v.toLowerCase();let d=v.replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("0"))d="218"+d.slice(1);else if(/^9\d{8}$/.test(d))d="218"+d;return d};
async function setRole(em,rl){const t=await tok();const r=await au("/rest/v1/rpc/admin_set_role",{method:"POST",body:JSON.stringify({p_email:em,p_role:rl})},t);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(/not found/i.test(String(d.message))?"لم نجد حساباً بهذا الإيميل (أو لا يمكنك تغيير صلاحيتك)":"تعذر الحفظ");await loadStaff()}
async function goTab(t){tab=t;msg="";if(t=="log")await loadLog();if(t=="staff")await loadStaff();if(t=="wallet")await loadWtx();if(t=="orders"){newN=0;document.title=T0}V()}
function pr(id){const c=document.querySelector(`[data-id="${id}"]`);if(!c)return;c.setAttribute("data-print","1");window.print();setTimeout(()=>c.removeAttribute("data-print"),600)}
async function start(){await loadMe();if(isStaff())await loadOrders();if(isAdmin())await loadWtx();V()}
document.addEventListener("click",async e=>{const q=s=>e.target.closest(s);let b;
if(b=q("[data-eye]")){const i=b.parentElement.querySelector("input"),on=i.type==="password";i.type=on?"text":"password";b.innerHTML=on?EYE1:EYE0;return}
